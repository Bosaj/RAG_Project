name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip fastapi==0.115.12 pydantic==2.8.2 pydantic-settings==2.8.1

      - name: Compile Python source
        run: python -m compileall -q src tests

      - name: Run schema tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover --start-directory tests --pattern 'test_*.py' --verbose
