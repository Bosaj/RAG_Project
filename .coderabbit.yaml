# CodeRabbit AI Code Review Configuration
# Enforces automated PR auditing, vector database integrity, and RAG security
version: 2
language: "en-US"
tone_instructions: "Focus on vector database retrieval latency, memory leaks, and prompt injection vulnerabilities."

reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "develop"

chat:
  auto_reply: true

tools:
  ast-grep:
    enabled: true
  ruff:
    enabled: true
  bandit:
    enabled: true

path_filters:
  - "!**/*.min.js"
  - "!**/dist/**"
  - "!**/build/**"
  - "!**/.git/**"
  - "!**/scratch*/**"
